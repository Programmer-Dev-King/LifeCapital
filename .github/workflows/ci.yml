name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
        env:
          PYTHONIOENCODING: utf-8
      - name: Build desktop solution
        run: dotnet build .\desktop\LifeCapital.slnx -c Release
      - name: Run desktop rules tests
        run: dotnet run --project .\desktop\tests\LifeCapital.RulesTests\LifeCapital.RulesTests.csproj -c Release
      - name: Run desktop setup smoke test
        run: dotnet run --project .\desktop\tests\LifeCapital.DesktopSmoke\LifeCapital.DesktopSmoke.csproj -c Release
