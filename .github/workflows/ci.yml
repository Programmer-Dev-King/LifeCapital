name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build desktop solution
        run: dotnet build .\desktop\LifeCapital.slnx -c Release
      - name: Run desktop rules tests
        run: dotnet run --project .\desktop\tests\LifeCapital.RulesTests\LifeCapital.RulesTests.csproj -c Release
      - name: Run desktop setup smoke test
        run: dotnet run --project .\desktop\tests\LifeCapital.DesktopSmoke\LifeCapital.DesktopSmoke.csproj -c Release
